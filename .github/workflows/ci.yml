name: CI

on:
  pull_request:
    branches: [main, master, rebuild/v2]
  push:
    branches: [main, master, rebuild/v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-only-secret-do-not-use-in-prod
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/bangarah
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SEED_TOKEN: ci

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bangarah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Assert non-prod DATABASE_URL
        # H10 (M11): if a future PR or secret leak ever overrides DATABASE_URL
        # in CI, refuse to run. Every CI job must point at the local services
        # postgres (postgres@localhost) or a *_test database — never prod.
        run: |
          if ! echo "$DATABASE_URL" | grep -Eq '^postgres://postgres:postgres@localhost' \
             && ! echo "$DATABASE_URL" | grep -Eq '_test(\?|$)'; then
            echo "Refusing to run: DATABASE_URL ($DATABASE_URL) does not look like a CI/test DB" >&2
            exit 1
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prime DB schema (B5 workaround)
        # The cold CI postgres has no schema and nothing runs migrations
        # (audit B5; the migrate CLI itself is broken — B2). Boot the app
        # once in dev mode: Payload pushes the schema on init (the same
        # mechanism the integration suite relies on), in a single process so
        # parallel build workers never race DDL (B1). Then swap drizzle's
        # dev sentinel for the real migration names so the prod-mode build
        # treats the DB as migrated and the runtime migrator stays idle —
        # the configuration the Phase-5.24 audit verified green.
        run: |
          npm run dev > devprime.log 2>&1 &
          npx wait-on http://localhost:3000/api/health -t 180000 || { tail -50 devprime.log; exit 1; }
          pkill -f "next dev" || true
          pkill -f "next-server" || true
          sleep 2
          psql "$DATABASE_URL" -c "DELETE FROM payload_migrations WHERE batch = -1"
          for f in src/payload/migrations/*.ts; do
            b=$(basename "$f" .ts)
            [ "$b" = "index" ] && continue
            psql -q "$DATABASE_URL" -c "INSERT INTO payload_migrations (name, batch) VALUES ('$b', 1)"
          done
      - name: Build
        id: build
        env:
          # `next build` runs with NODE_ENV=production, which trips the
          # payload.config boot guard (H1/M9: hard-fail on missing prod env
          # vars). CI satisfies it with obviously-dummy values; none of
          # these services are reached at build time.
          # PAYLOAD_DISABLE_SCHEMA_PUSH=true puts the adapter in
          # migrations-only mode (no push prompt) against the primed DB.
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci-dummy
          FLUTTERWAVE_WEBHOOK_SECRET: ci-dummy
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          R2_BUCKET: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_ACCOUNT_ID: ci-dummy
          PAYLOAD_DISABLE_SCHEMA_PUSH: "true"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Bundle-size budget
        run: node scripts/check-bundle-size.mjs build.log

  e2e:
    name: Playwright + axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bangarah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prime DB schema + seed (B5 workaround)
        # Schema push + catalog seed happen against the dev server because
        # the dev seed route hard-refuses NODE_ENV=production (by design).
        # See the quality job's prime step for the full B5/B2/B1 rationale.
        run: |
          npm run dev > devprime.log 2>&1 &
          npx wait-on http://localhost:3000/api/health -t 180000 || { tail -50 devprime.log; exit 1; }
          curl -fsS -X POST -H "x-seed-token: ci" http://localhost:3000/api/dev/seed
          pkill -f "next dev" || true
          pkill -f "next-server" || true
          sleep 2
          psql "$DATABASE_URL" -c "DELETE FROM payload_migrations WHERE batch = -1"
          for f in src/payload/migrations/*.ts; do
            b=$(basename "$f" .ts)
            [ "$b" = "index" ] && continue
            psql -q "$DATABASE_URL" -c "INSERT INTO payload_migrations (name, batch) VALUES ('$b', 1)"
          done
      - name: Build
        env:
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci-dummy
          FLUTTERWAVE_WEBHOOK_SECRET: ci-dummy
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          R2_BUCKET: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_ACCOUNT_ID: ci-dummy
          PAYLOAD_DISABLE_SCHEMA_PUSH: "true"
        run: npm run build
      - name: Start server
        env:
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci-dummy
          FLUTTERWAVE_WEBHOOK_SECRET: ci-dummy
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          R2_BUCKET: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_ACCOUNT_ID: ci-dummy
          PAYLOAD_DISABLE_SCHEMA_PUSH: "true"
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 60000
      - name: Playwright (incl. axe-core a11y)
        env:
          PLAYWRIGHT_REUSE_SERVER: "1"
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  integration:
    name: Integration (Vitest · money-path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bangarah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests resolve DATABASE_URL_TEST first; the dedicated DB keeps the
      # name "_test" so the setup-script safety guard accepts it. Payload
      # pushes schema into a fresh DB on the first vitest run.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/bangarah_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Create test database
        run: npm run test:integration:setup-db
      - name: Run integration tests
        run: npm run test:integration

  lighthouse:
    name: Lighthouse CI (perf + a11y budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bangarah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prime DB schema + seed (B5 workaround)
        # Same pattern as the e2e job — see the quality job's prime step
        # for the full B5/B2/B1 rationale.
        run: |
          npm run dev > devprime.log 2>&1 &
          npx wait-on http://localhost:3000/api/health -t 180000 || { tail -50 devprime.log; exit 1; }
          curl -fsS -X POST -H "x-seed-token: ci" http://localhost:3000/api/dev/seed
          pkill -f "next dev" || true
          pkill -f "next-server" || true
          sleep 2
          psql "$DATABASE_URL" -c "DELETE FROM payload_migrations WHERE batch = -1"
          for f in src/payload/migrations/*.ts; do
            b=$(basename "$f" .ts)
            [ "$b" = "index" ] && continue
            psql -q "$DATABASE_URL" -c "INSERT INTO payload_migrations (name, batch) VALUES ('$b', 1)"
          done
      - name: Build
        env:
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci-dummy
          FLUTTERWAVE_WEBHOOK_SECRET: ci-dummy
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          R2_BUCKET: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_ACCOUNT_ID: ci-dummy
          PAYLOAD_DISABLE_SCHEMA_PUSH: "true"
        run: npm run build
      - name: Start server
        env:
          RESEND_API_KEY: re_ci_dummy
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
          FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci-dummy
          FLUTTERWAVE_WEBHOOK_SECRET: ci-dummy
          UPSTASH_REDIS_REST_URL: https://ci-dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy
          R2_BUCKET: ci-dummy
          R2_ACCESS_KEY_ID: ci-dummy
          R2_SECRET_ACCESS_KEY: ci-dummy
          R2_ACCOUNT_ID: ci-dummy
          PAYLOAD_DISABLE_SCHEMA_PUSH: "true"
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 60000
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
